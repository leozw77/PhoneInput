name: Readback stability preview

on:
  push:
    branches:
      - feature/readback-stability-android-uia-20260821

permissions:
  contents: write

jobs:
  patch-build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/readback-stability-android-uia-20260821
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply Step 1 source patch
        shell: pwsh
        run: .\tools\apply-readback-stability-step1.ps1

      - name: Generate Gradle Wrapper
        shell: pwsh
        run: gradle -p .\native\android-native wrapper --gradle-version 8.13

      - name: Commit patched source to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "native/android-native/app/src/main/java/com/phoneinputenhanced/nativeclient/NativeInputDialog.kt"
          git add -- "src/PhoneInput/DesktopInputStateReader.cs"
          git add -- "native/android-native/app/build.gradle.kts"
          git add -- "docs/READBACK_STABILITY_STEP1_20260821.md"
          if (Test-Path "native/android-native/gradlew") { git add -- "native/android-native/gradlew" }
          if (Test-Path "native/android-native/gradlew.bat") { git add -- "native/android-native/gradlew.bat" }
          if (Test-Path "native/android-native/gradle/wrapper/gradle-wrapper.jar") { git add -- "native/android-native/gradle/wrapper/gradle-wrapper.jar" }
          if (Test-Path "native/android-native/gradle/wrapper/gradle-wrapper.properties") { git add -- "native/android-native/gradle/wrapper/gradle-wrapper.properties" }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Implement readback stability preview step1"
            git push origin HEAD:feature/readback-stability-android-uia-20260821
          }

      - name: Restore Windows project
        shell: pwsh
        run: dotnet restore .\src\PhoneInput\PhoneInput.csproj --configfile .\NuGet.Config

      - name: Build Windows project
        shell: pwsh
        run: dotnet build .\src\PhoneInput\PhoneInput.csproj -c Release --no-restore

      - name: Publish Windows test package
        shell: pwsh
        run: dotnet publish .\src\PhoneInput\PhoneInput.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\dist\windows

      - name: Build Android debug APK
        shell: pwsh
        run: .\native\android-native\gradlew.bat -p .\native\android-native assembleDebug --no-daemon

      - name: Package test deliverables
        shell: pwsh
        run: |
          $name = "PhoneInput-1.4.1-preview.1-readback-stability"
          Copy-Item ".\native\android-native\app\build\outputs\apk\debug\app-debug.apk" ".\$name.apk"
          Compress-Archive -Path ".\dist\windows\*" -DestinationPath ".\$name-Windows-x64.zip" -Force
          git archive --format=zip --output="$name-source.zip" HEAD
          Copy-Item ".\docs\READBACK_STABILITY_STEP1_20260821.md" ".\$name-TEST_NOTES.md"
          $files = @(
            "$name.apk",
            "$name-Windows-x64.zip",
            "$name-source.zip",
            "$name-TEST_NOTES.md"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content "$name-SHA256SUMS.txt" -Encoding ASCII

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhoneInput-1.4.1-preview.1-readback-stability
          if-no-files-found: error
          path: |
            PhoneInput-1.4.1-preview.1-readback-stability.apk
            PhoneInput-1.4.1-preview.1-readback-stability-Windows-x64.zip
            PhoneInput-1.4.1-preview.1-readback-stability-source.zip
            PhoneInput-1.4.1-preview.1-readback-stability-TEST_NOTES.md
            PhoneInput-1.4.1-preview.1-readback-stability-SHA256SUMS.txt
