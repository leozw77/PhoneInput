name: Build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\src\PhoneInput\PhoneInput.csproj --configfile .\NuGet.Config

      - name: Build
        run: dotnet build .\src\PhoneInput\PhoneInput.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish .\src\PhoneInput\PhoneInput.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\dist

      - name: Package
        shell: pwsh
        run: |
          Copy-Item .\README.md .\dist\README.md
          Copy-Item .\LICENSE .\dist\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\dist\THIRD-PARTY-NOTICES.md
          Compress-Archive -Path .\dist\* -DestinationPath .\PhoneInputEnhanced-Windows-x64.zip
          (Get-FileHash .\PhoneInputEnhanced-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Set-Content .\PhoneInputEnhanced-Windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInputEnhanced-Windows-x64
          path: |
            PhoneInputEnhanced-Windows-x64.zip
            PhoneInputEnhanced-Windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PhoneInputEnhanced-Windows-x64.zip
            PhoneInputEnhanced-Windows-x64.zip.sha256

  w4-re-tools:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/w4-re-helper-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Build JieLi pi32v2 SLEIGH and offline pypcode kit
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip git python3-pip
          curl -L --fail --retry 3 \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip \
            -o ghidra.zip
          unzip -q ghidra.zip
          GHIDRA="$PWD/ghidra_12.0.4_PUBLIC"
          git clone --depth 1 https://github.com/quarkslab/ghidra-jieli.git
          SLEIGH="$(find "$GHIDRA" -type f -name sleigh -perm -111 | head -1)"
          echo "SLEIGH=$SLEIGH"
          test -x "$SLEIGH"
          "$SLEIGH" ghidra-jieli/data/languages/pi32v2.slaspec ghidra-jieli/data/languages/pi32v2.sla
          test -s ghidra-jieli/data/languages/pi32v2.sla
          mkdir -p w4-re-kit/jieli-languages w4-re-kit/wheels
          cp ghidra-jieli/data/languages/* w4-re-kit/jieli-languages/
          python3 -m pip download --only-binary=:all: --dest w4-re-kit/wheels pypcode
          find w4-re-kit -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: w4-jieli-re-kit
          path: w4-re-kit
