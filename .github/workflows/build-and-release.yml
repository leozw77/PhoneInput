name: Build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore .\src\PhoneInput\PhoneInput.csproj --configfile .\NuGet.Config
      - name: Build
        run: dotnet build .\src\PhoneInput\PhoneInput.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish .\src\PhoneInput\PhoneInput.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\dist
      - name: Package
        shell: pwsh
        run: |
          Copy-Item .\README.md .\dist\README.md
          Copy-Item .\LICENSE .\dist\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\dist\THIRD-PARTY-NOTICES.md
          Compress-Archive -Path .\dist\* -DestinationPath .\PhoneInputEnhanced-Windows-x64.zip
          (Get-FileHash .\PhoneInputEnhanced-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() | Set-Content .\PhoneInputEnhanced-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInputEnhanced-Windows-x64
          path: |
            PhoneInputEnhanced-Windows-x64.zip
            PhoneInputEnhanced-Windows-x64.zip.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PhoneInputEnhanced-Windows-x64.zip
            PhoneInputEnhanced-Windows-x64.zip.sha256

  w4-re-tools:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/w4-re-helper-20260823'
    runs-on: ubuntu-latest
    steps:
      - name: Download official JieLi Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p w4-vendor-toolchain
          cd w4-vendor-toolchain
          curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain -o jieli-linux-toolchain.tar
          file jieli-linux-toolchain.tar
          ls -lh jieli-linux-toolchain.tar
          tar -tf jieli-linux-toolchain.tar | head -80 || true
      - uses: actions/upload-artifact@v4
        with:
          name: w4-jieli-vendor-toolchain
          path: w4-vendor-toolchain/jieli-linux-toolchain.tar
          compression-level: 0
