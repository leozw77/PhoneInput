name: Build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Windows
        run: dotnet restore .\src\PhoneInput\PhoneInput.csproj --configfile .\NuGet.Config

      - name: Build Windows
        run: dotnet build .\src\PhoneInput\PhoneInput.csproj -c Release --no-restore

      - name: Publish Windows
        run: dotnet publish .\src\PhoneInput\PhoneInput.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\dist

      - name: Build Android preview APK
        shell: pwsh
        run: .\native\android-native\gradlew.bat -p .\native\android-native assembleDebug --no-daemon

      - name: Package preview deliverables
        shell: pwsh
        run: |
          $name = "PhoneInput-1.4.1-preview.1-readback-stability"
          Copy-Item .\README.md .\dist\README.md
          Copy-Item .\LICENSE .\dist\LICENSE
          Copy-Item .\THIRD-PARTY-NOTICES.md .\dist\THIRD-PARTY-NOTICES.md
          Compress-Archive -Path .\dist\* -DestinationPath ".\$name-Windows-x64.zip" -Force
          Copy-Item ".\native\android-native\app\build\outputs\apk\debug\app-debug.apk" ".\$name.apk"
          git archive --format=zip --output="$name-source.zip" HEAD
          Copy-Item ".\docs\READBACK_STABILITY_STEP1_20260821.md" ".\$name-TEST_NOTES.md"

          $files = @(
            "$name-Windows-x64.zip",
            "$name.apk",
            "$name-source.zip",
            "$name-TEST_NOTES.md"
          )
          $sums = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $sums | Set-Content ".\$name-SHA256SUMS.txt" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneInput-1.4.1-preview.1-readback-stability
          path: |
            PhoneInput-1.4.1-preview.1-readback-stability-Windows-x64.zip
            PhoneInput-1.4.1-preview.1-readback-stability.apk
            PhoneInput-1.4.1-preview.1-readback-stability-source.zip
            PhoneInput-1.4.1-preview.1-readback-stability-TEST_NOTES.md
            PhoneInput-1.4.1-preview.1-readback-stability-SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PhoneInput-1.4.1-preview.1-readback-stability-Windows-x64.zip
            PhoneInput-1.4.1-preview.1-readback-stability.apk
            PhoneInput-1.4.1-preview.1-readback-stability-source.zip
            PhoneInput-1.4.1-preview.1-readback-stability-TEST_NOTES.md
            PhoneInput-1.4.1-preview.1-readback-stability-SHA256SUMS.txt
